name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sheltr-esp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compila firmware (T-ETH-Lite-ESP32S3)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Installa PlatformIO
        run: pip install --upgrade platformio

      - name: Versione e tag della release
        id: version
        run: |
          BASE="$(grep -o "SHELTR_FW_VERSION='\"[^\"]*\"'" platformio.ini | head -1 | sed "s/.*'\"//;s/\"'//")"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${BASE}+${GITHUB_SHA::7}"
            TAG="v${BASE}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Versione: ${VERSION} (release ${TAG})"

      - name: Marca il binario con il tag della release
        run: |
          # Il dispositivo confronta questo tag con l'ultima release su GitHub
          # per sapere se c'è un aggiornamento.
          sed -i "s|SHELTR_FW_RELEASE='\"dev\"'|SHELTR_FW_RELEASE='\"${{ steps.version.outputs.tag }}\"'|" platformio.ini
          grep SHELTR_FW_RELEASE platformio.ini

      - name: Compila
        run: pio run -e t-eth-lite-esp32s3

      - name: Prepara artefatti
        run: |
          mkdir -p dist
          BUILD=.pio/build/t-eth-lite-esp32s3
          cp "$BUILD/firmware.bin" "dist/sheltr-esp-firmware.bin"
          cp "$BUILD/sheltr-esp-merged.bin" "dist/sheltr-esp-merged.bin"
          cp "$BUILD/bootloader.bin" "dist/bootloader.bin"
          cp "$BUILD/partitions.bin" "dist/partitions.bin"
          ls -la dist

      - name: Pubblica artefatti di build
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          retention-days: 30

  pages:
    name: Pubblica web flasher su GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # `contents: read` va ripetuto: dichiarare i permessi nel job sostituisce
      # quelli globali, e senza di esso actions/checkout non può leggere il repo.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Costruisci il sito
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p _site/firmware
          cp -r site/* _site/
          cp dist/sheltr-esp-merged.bin _site/firmware/
          cp dist/sheltr-esp-firmware.bin _site/firmware/
          mkdir -p _site/docs
          cp -r docs/* _site/docs/
          cp README.md _site/docs/
          sed "s/__VERSION__/${VERSION}/g" site/manifest.template.json > _site/manifest.json
          rm -f _site/manifest.template.json
          echo "${VERSION}" > _site/firmware/VERSION
          ls -R _site | head -50

      # Richiede GitHub Pages già attivo sul repository con sorgente "GitHub Actions"
      # (Settings -> Pages): il GITHUB_TOKEN del workflow non può abilitarlo da solo.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  prerelease:
    name: Pubblica la release di main
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Le note vanno in un file: così non prendono l'indentazione dello YAML.
          {
            git log -1 --pretty=format:'%s%n%n%b'
            printf '\n\n'
            printf -- '- `sheltr-esp-firmware.bin`: aggiornamento OTA (il dispositivo lo scarica da solo da Sistema -> Aggiornamento firmware)\n'
            printf -- '- `sheltr-esp-merged.bin`: immagine completa da scrivere a `0x0` (flash da seriale o da browser)\n'
          } > notes.md
          # La release viene ricreata se il workflow viene rilanciato sullo stesso commit.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            dist/sheltr-esp-firmware.bin \
            dist/sheltr-esp-merged.bin \
            --target "$GITHUB_SHA" \
            --title "Sheltr ESP $VERSION" \
            --notes-file notes.md

  release:
    name: Allega i binari alla release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sheltr-esp-merged.bin
            dist/sheltr-esp-firmware.bin
          body: |
            Firmware Sheltr ESP ${{ needs.build.outputs.version }} per LilyGO T-ETH-Lite ESP32S3.

            - `sheltr-esp-merged.bin`: immagine completa (bootloader + partizioni + app), da scrivere a offset `0x0`
              oppure direttamente dal browser su https://filippobenozzi.github.io/sheltr-esp/
            - `sheltr-esp-firmware.bin`: solo applicazione, per l'aggiornamento OTA dall'interfaccia web
