; Sheltr ESP - firmware per LilyGO T-ETH-Lite ESP32S3
; https://github.com/filippobenozzi/sheltr-esp

[platformio]
default_envs = t-eth-lite-esp32s3

[env]
platform = espressif32@6.7.0
framework = arduino
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
upload_speed = 921600
extra_scripts =
	pre:scripts/build_web.py
	post:scripts/merge_firmware.py
board_build.partitions = partitions_sheltr.csv
board_build.filesystem = littlefs
lib_deps =
	bblanchon/ArduinoJson@^7.2.1
	knolleary/PubSubClient@^2.8
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DSHELTR_FW_VERSION='"0.5.0"'
	; Tag della release da cui proviene il binario: lo inietta la CI, "dev" in locale.
	-DSHELTR_FW_RELEASE='"dev"'
	-DMQTT_MAX_PACKET_SIZE=1024
	-DMQTT_KEEPALIVE=30

; ESP32-S3-WROOM-1 (N16R8) + W5500 - FLASH 16MB / PSRAM 8MB OPI
[env:t-eth-lite-esp32s3]
board = esp32s3box
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DLILYGO_T_ETH_LITE_ESP32S3
	-DSHELTR_BOARD_NAME='"T-ETH-Lite-ESP32S3"'
	-UARDUINO_USB_CDC_ON_BOOT
lib_ignore =
	Ethernet
